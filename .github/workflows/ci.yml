name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: ./.github/actions/setup-ffmpeg

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

      - name: Release-Build
        run: cargo build --release

      - name: Smoke-Test (EXE startet mit DLLs)
        shell: pwsh
        # GUI-Subsystem-EXE: PowerShell wartet nicht von selbst, daher Start-Process -Wait.
        run: |
          $p = Start-Process ./target/release/framescope.exe -ArgumentList "--version" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Exit-Code $($p.ExitCode)" }
